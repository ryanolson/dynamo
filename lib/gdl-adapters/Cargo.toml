[package]
name = "dynamo-gdl-adapters"
description = "Bridge between Dynamo's engines and operators and gdl's local pipeline traits"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Only the `gdl` crate, never gdl's runtime or code generator: they bring a
# second velo from git. `tests/dependencies.rs` checks.
[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
dynamo-runtime = { workspace = true }
futures = { workspace = true }
gdl = { workspace = true }
tokio = { workspace = true }

# `dynamo-llm` is for the integration tests only: `dynamo-llm` will depend on
# this crate to compose its pipelines, and integration tests link this crate's
# library as `dynamo-llm` does, so the dev-dependency cycle stays harmless.
[dev-dependencies]
dynamo-kv-router = { workspace = true }
dynamo-llm = { workspace = true }
dynamo-mocker = { workspace = true }
dynamo-renderer = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
temp-env = { version = "0.3.6", features = ["async_closure"] }
uuid = { workspace = true }
